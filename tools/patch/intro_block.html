<!-- 启动动画（src/intro.js 负责播放；测试模式 ?test 或 ?nointro 时直接移除） -->
<section id="intro"><video playsinline preload="auto"><source src="Asset/UI/intro.mp4" type="video/mp4"><source src="Asset/UI/intro.webm" type="video/webm"></video><div class="intro-tip">点击开启声音</div></section>
<script>
  (() => { // 模块脚本加载要一会儿：这里先开始播，免得先闪一下大厅
    const q = new URLSearchParams(location.search), el = document.getElementById('intro');
    if (q.has('test') || q.has('nointro')) { el.remove(); return; }
    const v = el.querySelector('video');
    v.play().catch(() => { v.muted = true; el.querySelector('.intro-tip').classList.add('on'); v.play().catch(() => {}); });
  })();
</script>
